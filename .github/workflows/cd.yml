name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Go tests
        run: go test ./... -v
        working-directory: server

      - name: Build server binary
        run: go build -o notes-server ./cmd/server
        working-directory: server

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Copy artifacts to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "server/notes-server,frontend/dist"
          target: /opt/notes-app
          strip_components: 0

      - name: Restart service & verify
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            chown notes:notes /opt/notes-app/server/notes-server
            chmod +x /opt/notes-app/server/notes-server
            systemctl restart notes-api
            sleep 3
            STATUS=$(systemctl is-active notes-api)
            if [ "$STATUS" != "active" ]; then
              echo "Service failed to start (status: $STATUS)"
              exit 1
            fi
            echo "Service restarted successfully"

      - name: Health check after deploy
        run: |
          sleep 5
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://notes-app.giaquyen.click/api/health)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Health check FAILED (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "Health check PASSED (HTTP $HTTP_CODE)"

      - name: Notify success via Telegram
        if: success()
        shell: bash
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="✅ <b>Deploy thành công</b>
          <b>Người push:</b> ${{ github.actor }}
          <b>Commit:</b> ${{ github.event.head_commit.message }}
          <b>Workflow:</b> ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=HTML"

      - name: Notify failure via Telegram
        if: failure()
        shell: bash
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="❌ <b>Deploy thất bại</b>
          <b>Người push:</b> ${{ github.actor }}
          <b>Commit:</b> ${{ github.event.head_commit.message }}
          <b>Log:</b> ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=HTML"
